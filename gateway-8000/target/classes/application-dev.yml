spring:
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.10.9:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]': # 匹配所有路由
            allowed-origins:
              - "http://localhost:8080"  # 你的前端地址，生产环境请替换为真实域名
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS  # 务必加上 OPTIONS 方法
            allowed-headers:
              - "*"  # 允许所有请求头，或根据需要指定如 "Content-Type", "Authorization"
            allow-credentials: true  # 如果请求需要携带 Cookie
            max-age: 3600  # 预检请求的缓存时间，避免频繁发送
      discovery:
        locator:
          enabled: true     # 动态路由，从注册中心根据微服务的名字获得目标节点的地址
      routes:       # 路由规则（数组）
        - id: userRoute   # 每一项路由都有一个唯一的id编号，可以自定义
          uri: lb://user-service    # lb=负载均衡，会动态寻址
          # uri: http://192.168.1.111:7001
          predicates:   # 匹配断言，符合条件则放行（可以模糊匹配，或者精确匹配到某个具体的端口和名称）
            - Path=/u/**
        - id: companyRoute
          uri: lb://company-service
          predicates:
            - Path=/c/**
        - id: authRoute
          uri: lb://auth-service
          predicates:
            - Path=/a/**,/passport/**,/saas/**,/admin/**