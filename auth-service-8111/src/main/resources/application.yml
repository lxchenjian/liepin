server:
  port: ${port:8111}
  tomcat:
    uri-encoding: UTF-8
    max-swallow-size: -1

spring:
  application:
    name: auth-service # nacos时候配置的
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.10.9:8848


mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  global-config:
    db-config:
      id-type: assign_id
        # assign_id 是 MyBatis-Plus 提供的主键类型，基于雪花算法（Snowflake）生成分布式唯一 ID
      # @TableId(type = IdType.ASSIGN_ID)
      update-strategy: not_empty # 字符串为"" 不修改
    banner: false

