spring:
  datasource:                                     # 数据源的相关配置
    type: com.zaxxer.hikari.HikariDataSource      # 数据源的类型，可以更改为其他的数据源配置，比如druid
    driver-class-name: com.mysql.cj.jdbc.Driver      # mysql/MariaDB 的数据库驱动类名称
    url: jdbc:mysql://192.168.10.9:3306/liepin?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    hikari:
      connection-timeout: 30000               # 等待连接池分配连接的最大时间（毫秒），超过这个时长还没有可用的连接，则会抛出SQLException
      minimum-idle: 5                         # 最小连接数
      maximum-pool-size: 20                   # 最大连接数
      auto-commit: true                       # 自动提交
      idle-timeout: 600000                    # 连接超时的最大时长（毫秒），超时则会被释放（retired）
      pool-name: DataSourceHikariCP           # 连接池的名字
      max-lifetime: 18000000                  # 连接池的最大生命时长（毫秒），超时则会被释放（retired）
      connection-test-query: SELECT 1
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.10.9:8848
  redis:
    host: 192.168.10.9
    port: 6379
    database: 0
    password: 123456
  rabbitmq:
    host: 192.168.10.9
    port: 5672
    virtual-host: /
    username: admin
    password: ENC(jRpmRInT8OFJfgaJumuihg==)
    listener:
      simple:
        acknowledge-mode: manual  # 手动ack确认
        # 如何测试，生产者发送10条，然后消费者打断点不确定
#        prefetch: 2  # 限流/流量削峰/每次每个消费者从mq中拉去的消息的数量，直到手动ack确认之后，才会拉去下个消息
