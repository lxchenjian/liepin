server:
  port: ${port:7001} # 多实例集群进行Nacos注册
  tomcat:
    uri-encoding: UTF-8
    max-swallow-size: -1

spring:
  application:
    name: user-service # nacos时候配置的
  profiles:
    active: dev
  banner:
    location: classpath:banner/banner.txt
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.10.9:8848
#    image:
#      location: banner/cat.png

# 配置日志级别
logging:
  level:
    root: info

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  global-config:
    db-config:
      id-type: assign_id
    banner: false
